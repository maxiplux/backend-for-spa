####
## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:LOCALHOST}:${PGPORT:5432}/${PGDATABASE:postgres}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    rest:
      detection-strategy: annotated
  main:
    allow-circular-references: true

  security:
    saml2:
      relyingparty:
        registration:
          pingone:
            assertingparty:
              entity-id: https://auth.pingone.com/21620bf7-6daf-4fd6-a951-ae0f9b1bd7af
              metadata-uri: https://auth.pingone.com/21620bf7-6daf-4fd6-a951-ae0f9b1bd7af/saml20/metadata/8ec2bf6f-6c90-4e58-ab6b-1f50aab6cfcf
              #metadata-uri: "classpath:credentials/pingone-metadata.xml"
              sso-url: https://auth.pingone.com/21620bf7-6daf-4fd6-a951-ae0f9b1bd7af/saml20/idp/sso
              verification:
                credentials:
                  - certificate-location: "classpath:credentials/pingone-idp-signing.crt"
            signing:
              credentials:
                - private-key-location: classpath:credentials/private.key
                  certificate-location: classpath:credentials/certificate.crt

            decryption:
              credentials:
                - private-key-location: classpath:credentials/private.key
                  certificate-location: classpath:credentials/certificate.crt


            singlelogout:
              #url: https://auth.pingone.com/21620bf7-6daf-4fd6-a951-ae0f9b1bd7af/saml20/idp/slo
              response-url: "{baseUrl}/logout/saml2/slo"
            acs:
              #location: "{baseUrl}/login/saml2/sso/pingone"
              location: "http://localhost:8080/app/login/saml2/sso/pingone"
            entity-id: IDP_ENTITY_ID






server:
  servlet:
    context-path: /app
  port: 8080

logging:
  level:
    root: INFO
    org:
      springframework:
        web: DEBUG
        security:
            web: debug
            saml: DEBUG
      opensaml:
        xmlsec: DEBUG
  org.opensaml.xmlsec: DEBUG
#openssl req -x509 -newkey rsa:2048 -keyout private.key -out certificate.crt -days 365 -nodes -subj "/CN=spring-boot"



